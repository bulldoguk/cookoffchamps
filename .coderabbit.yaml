# CodeRabbit review config (SW-71). Quiet on purpose: findings only.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
tone_instructions: "Terse and specific. Only flag real problems; no praise, no filler."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!package-lock.json"
    - "!public/app.js"
    - "!public/app.js.map"
    - "!public/**/*.pdf"
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        The repo requires 100% lines, branches, functions and statements
        (vitest.config.ts, enforced in CI). Flag any new branch or function
        that the change leaves without a test. Any istanbul ignore must say
        why in its comment.
    - path: "src/client/**/*.ts"
      instructions: |
        Build DOM with h() from dom.ts: text is set as text, never HTML. Flag
        innerHTML, insertAdjacentHTML, document.write, inline event-handler
        attributes and inline <script>, since the CSP forbids inline scripts.
        User-visible strings come from m() (src/client/i18n), never literals.
    - path: "src/client/i18n/**/*.ts"
      instructions: |
        es.ts is typed against Messages from en.ts, so every key in en must
        exist in es with the same shape (functions keep their parameters).
        Spanish is Texas/Mexican ("tú"), and avoids guessing the organizer's
        gender. Don't suggest translations for correctness of dialect alone.
    - path: "src/worker/security.ts"
      instructions: |
        This holds the CSP and the other response headers. Flag anything that
        widens script-src, connect-src, frame-src or default-src, adds
        'unsafe-inline' or 'unsafe-eval' to scripts, or drops a header. A new
        third-party origin needs a comment saying why.
    - path: "src/worker/**/*.ts"
      instructions: |
        Event links are the key to an event: they must not leak in Referer,
        logs or error bodies. Check cross-site request handling and that
        every route passes through withSecurityHeaders.
    - path: "scripts/check-publish.mjs"
      instructions: |
        The deploy gate is an allowlist of file types plus secret patterns.
        Flag any change that turns it into a denylist, loosens a pattern, or
        adds an extension without a comment saying why.
    - path: "public/**"
      instructions: |
        Everything here is uploaded by wrangler. Only allowlisted web asset
        types (see scripts/check-publish.mjs); no secrets, keys or notes.
    - path: ".github/**"
      instructions: "Flag any step that exposes secrets to pull-request code."
    - path: "wrangler.jsonc"
      instructions: "Flag secrets or tokens in vars; those belong in wrangler secrets."
  tools:
    gitleaks:
      enabled: true
    github-checks:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
